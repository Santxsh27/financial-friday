name: Financial Friday checks

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:
    inputs:
      run_legacy_anthos:
        description: "Run the optional historical Bank of Anthos fixture"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  deterministic-core:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install Financial Friday
        run: python -m pip install ".[test]"
      - name: Run deterministic tests
        run: python -m unittest discover -s tests -v
      - name: Check bounded cloud verification tooling (offline)
        run: python -m unittest discover -s tools -p 'test_*.py' -v
      - name: Evaluate Friday proposal safety (no payments or AI calls)
        run: python -m carapace_core.friday_evaluation > friday-safety-evaluation.json
      - name: Record labelled synthetic checkup baseline (tuning only, no AI calls)
        run: python tools/evaluate_statement_checkup.py --output friday-statement-evaluation.json
      - name: Check AI scorer controls (authored synthetic answers, no AI calls)
        run: python tools/evaluate_friday_statement_ai.py --protocol v2 --output friday-statement-ai-controls.json
      - name: Preserve proposal evaluation evidence
        uses: actions/upload-artifact@v4
        with:
          name: friday-safety-python-${{ matrix.python-version }}
          path: |
            friday-safety-evaluation.json
            friday-statement-evaluation.json
            friday-statement-ai-controls.json
      - name: Verify valid reference payment
        run: carapace verify examples/payment-promise.json examples/execution-valid.json

  container-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build container
        run: docker build --tag financial-friday-core:ci .
      - name: Run tests in container
        run: docker build --target test --tag financial-friday-core-test:ci .
      - name: Execute container tests
        run: docker run --rm financial-friday-core-test:ci
      - name: Verify Compose API and persistent evidence volume
        run: |
          docker compose up --detach --build api
          for attempt in {1..20}; do
            if curl --fail --silent http://127.0.0.1:8080/health/ready; then
              break
            fi
            if [ "$attempt" = "20" ]; then
              docker compose logs api
              exit 1
            fi
            sleep 1
          done
          test "$(docker compose exec -T api id -u)" = "10001"
          test "$(docker compose exec -T api stat -c %u /data)" = "10001"
      - name: Verify the standalone Friday website (no bank or AI credentials)
        run: |
          docker compose up --detach anthos-demo
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8090/health; then
              break
            fi
            if [ "$attempt" = "30" ]; then
              docker compose logs anthos-demo
              exit 1
            fi
            sleep 2
          done
          curl --fail --silent http://127.0.0.1:8090/ > friday-home.html
          python -c "from pathlib import Path; page=Path('friday-home.html').read_text(); assert 'What can I help you with?' in page; assert 'ARTIFICIAL EXAMPLE' in page; assert 'const bankNav=' not in page"
      - name: Clean up Compose services
        if: always()
        run: docker compose down --volumes

  bank-of-anthos-integration:
    # Historical engineering fixture, never a dependency of the customer app.
    if: github.event_name == 'workflow_dispatch' && inputs.run_legacy_anthos
    env:
      FRIDAY_LEGACY_DEMO_ENABLED: "true"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Start the official Bank of Anthos ledger slice
        run: docker compose --profile anthos up --detach --build api anthos-ledger anthos-demo
      - name: Wait for the local integration page
        run: |
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8090/health > status.json \
              && jq -e '.status == "ok"' status.json > /dev/null; then
              break
            fi
            if [ "$attempt" = "30" ]; then
              docker compose --profile anthos logs
              exit 1
            fi
            sleep 2
          done
          jq -e '.status == "ok"' status.json
      - name: Verify an artificial ledger row and duplicate-debit incident
        run: |
          # Compose waits for the API and official PostgreSQL slice to be healthy.
          # The current web UI no longer exposes the earlier /api/run route.
          docker compose --profile anthos exec -T api carapace-anthos-demo \
            --database-url postgresql://admin:password@anthos-ledger:5432/postgresdb \
            --api-base-url http://127.0.0.1:8080 --json > result.json
          jq . result.json
          jq -e '.correct_payment_verdict == "MATCH" and
                 .duplicate_payment_verdict == "MISMATCH" and
                 .overall == "PASS"' result.json
      - name: Clean up the integration
        if: always()
        run: docker compose --profile anthos down --volumes
